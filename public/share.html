<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Health summary · shared privately</title>
<style>
  body{margin:0;font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:#FFF8EC;color:#2B2620}
  .bar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#2E7D4F;color:#fff;font-size:13px;z-index:5}
  .bar b{font-weight:700}.bar span{opacity:.85}.bar button{margin-left:auto;background:#fff;color:#2E7D4F;border:0;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
  #doc{max-width:860px;margin:0 auto;background:#fff;min-height:60vh;padding:4px 0 30px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  .msg{max-width:520px;margin:18vh auto;text-align:center;padding:24px}.msg h1{font:italic 600 26px Georgia,serif;color:#2E5A2E}
  @media print{.bar{display:none}#doc{box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><b>🌳 Affaan's World</b><span>Health summary shared privately by the family · link expires automatically</span><button id="printBtn" type="button">Print / PDF</button></div>
<div id="doc"><div class="msg"><h1>Opening the summary…</h1></div></div>
<script src="./js/share.js"></script>
</body>
</html>
